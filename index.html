<!DOCTYPE html>
<html>
    <head>
        <title>My First Web Page</title>
        <!-- Embed Style Method -->
        <style>
            header {
                background: url('images/central-park.jpg') 0 -200px; /* place image as background */
                background-size: 1700px; /*
                /* background-position: 0 -200px; */
                /* background-repeat: no-repeat; */
                height: 450px; /* give header some height to display the background image */
                width: 100%;
                padding-top: 100px;
                padding-left: 100px;
                font-weight: bold;
                font-family: Arial, Helvetica, sans-serif;

            }
            li {
                list-style-type: none;
                display: inline;
                padding: 0 20px;
            }
            li a {
                text-decoration: none; /* Remove Underline */
            }
            li a:link {
                color: #000; /* Before click */
            }
            li a:visited {
                color: #813db3; /* After click */
            }
            li a:hover {
                color: #333; /* Mouse Over */
            }
            li a:active {
                color: #753a30; /* Mouse Down */
            }
            nav {
                background-color:rgb(225, 245, 238);
                height: 50px;
                text-align: center;
                padding-top: 2px;
            }
            main {
                height: 500px; /* give some height to get a better sebse of how the page could look like */
            }
            main h1 {
                color:rgb(129, 141, 179);
                font-family: arial;
            }
            footer {
                height: 40px;
                background-color:rgb(129, 141, 179);
                text-align: center;
                padding-top: 20px;
                color:rgb(211,218,240);
            }

                
        </style>    
    </head>
    <body>
<!-- Container to wrap everything -->
        <div id="container">

<!--brand of website -->
            <header style="font-size: 60px; color: #fff;">My Web Site Brand</header>
            <!-- main navigation -->
            <nav>
                <ul>
                    <li><a href="index.html">Home</a></li>
                    <li><a href="page2.html">About</a></li>
                    <li>Gallery</li>
                    <li><a href="page3.html">Contact</a></li>
                </ul>
            </nav> <!-- End Main Navigation-->
                
            <!-- Main Content-->
        <main>
        <h1>My First Heading</h1>
        <p>My first paragraph.</p>
        </main> <!-- End Main Content-->

        <!-- Footer Information-->
        <footer>&copy; Copyright 2020</footer>

        </div> <!-- End Container 

    </body>
</html>
