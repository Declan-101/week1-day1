<!DOCTYPE html>
<html>
    <head>

          <link rel="stylesheet" href="style.css">  

        <title>My Third Web Page</title>
    </head>
    <body>
<!-- Container to wrap everything -->
        <div id="container">

<!--brand of website -->
            <header>My Web Site Brand</header>
            <!-- main navigation -->
            <nav>
                <ul>
                    <li><a href="index.html">Home</a></li>
                    <li><a href="page2.html">About</a></li>
                    <li><a href="page4.html">Gallery</a></li>
                    <li><a href="page3.html">Contact</a></li>
                </ul>
            </nav> <!-- End Main Navigation-->
                
            <!-- Main Content-->
        <main>
            <h1>My Third Heading</h1>
            <p>My Third paragraph.</p>

            <form action="/contact" method="post">
            <fieldset>
                <legend>User personal information</legend>
                <label>Enter your full name</label> 
                <input type="text" name="name">
                <label>Enter your email</label>
                <input type="email" name="email">
                <label>Enter your phone</label>
                <input type="text" name="phone">
                <label>Select your gender</label>
                <input type="radio" name="gender" value="male">Male
                <input type="radio" name="gender" value="female">Female 

                <label>How should we contact you?</label>
                <select id="contactMethod">
                    <option id="choose" value="">Choose One</option>
                    <option id="emailOption" value="email">Email</option>
                    <option id ="phoneOption" value="Phone">Phone</option>
                </select>

                <div id="emailBox" class="contactBox">
                    <label>Entre best email to contact you:</label> 
                    <input type="email" name="bestEmail">
                </div>

                <div id="phoneBox" class="contactbox">
                    <label>Entre best phone number to contact you:</label>
                    <input type="phone" name="bestPhone">
                </div>

                <label>Tell us the reason of your visit today:</label>
                <textarea rows="5" cols="30"></textarea>
                <input type="submit" value="sign-up">
            </fieldset>
            </form>      
        </main> <!-- End Main Content-->

        <!-- Footer Information-->
        <footer>&copy; Copyright 2020</footer>

        </div> <!-- End Container--> 

    </body>
</html>
